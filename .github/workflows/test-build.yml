name: Build iOS simulator test app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-simulator-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: johngraven75/Cinavault-3.0
          ref: 8b9cf5e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: npm ci
      - run: npm run test
      - run: npx tauri ios init --ci
      - run: npx tauri ios build --debug --target aarch64-apple-ios-sim
      - uses: actions/upload-artifact@v4
        with:
          name: cinavault-3-ios-simulator-app
          path: src-tauri/gen/apple/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
